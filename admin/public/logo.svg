<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#2563EB"/>

  <!-- Calendar base -->
  <rect x="14" y="20" width="28" height="26" rx="3" fill="white" opacity="0.95"/>
  <!-- Calendar header -->
  <rect x="14" y="20" width="28" height="9" rx="3" fill="#1D4ED8"/>
  <rect x="14" y="26" width="28" height="3" fill="#1D4ED8"/>

  <!-- Calendar binding pegs -->
  <rect x="21" y="17" width="3" height="6" rx="1.5" fill="#93C5FD"/>
  <rect x="40" y="17" width="3" height="6" rx="1.5" fill="#93C5FD"/>

  <!-- Calendar grid dots -->
  <rect x="19" y="33" width="4" height="4" rx="1" fill="#BFDBFE"/>
  <rect x="26" y="33" width="4" height="4" rx="1" fill="#BFDBFE"/>
  <rect x="33" y="33" width="4" height="4" rx="1" fill="#BFDBFE"/>
  <rect x="19" y="40" width="4" height="4" rx="1" fill="#BFDBFE"/>
  <rect x="26" y="40" width="4" height="4" rx="1" fill="#2563EB"/>
  <rect x="33" y="40" width="4" height="4" rx="1" fill="#BFDBFE"/>

  <!-- Stethoscope -->
  <path d="M36 30 Q44 30 44 38 Q44 46 38 46" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="47" r="2.5" fill="#10B981"/>
  <!-- Stethoscope earpiece -->
  <circle cx="44" cy="30" r="2" fill="#10B981"/>

  <!-- Cross / plus on calendar header -->
  <rect x="30" y="22" width="2" height="5" rx="1" fill="white"/>
  <rect x="28.5" y="23.5" width="5" height="2" rx="1" fill="white"/>
</svg>
