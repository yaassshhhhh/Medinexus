<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <rect width="200" height="240" rx="16" fill="#FDF2F8"/>
  <!-- Body / coat -->
  <rect x="50" y="145" width="100" height="95" rx="12" fill="white"/>
  <!-- Scrubs underneath -->
  <rect x="60" y="155" width="80" height="85" rx="8" fill="#EC4899"/>
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="25" rx="8" fill="#F5C5A3"/>
  <!-- Head -->
  <ellipse cx="100" cy="108" rx="34" ry="36" fill="#F5C5A3"/>
  <!-- Long hair -->
  <ellipse cx="100" cy="76" rx="36" ry="20" fill="#7c3aed"/>
  <rect x="64" y="76" width="14" height="50" rx="7" fill="#7c3aed"/>
  <rect x="122" y="76" width="14" height="50" rx="7" fill="#7c3aed"/>
  <rect x="64" y="76" width="72" height="20" fill="#7c3aed"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="108" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="112" cy="108" rx="4" ry="4.5" fill="white"/>
  <circle cx="89" cy="109" r="2.5" fill="#4a1942"/>
  <circle cx="113" cy="109" r="2.5" fill="#4a1942"/>
  <!-- Lashes -->
  <path d="M84 104 L86 101 M88 103 L88 100 M92 104 L94 101" stroke="#4a1942" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M108 104 L110 101 M112 103 L112 100 M116 104 L118 101" stroke="#4a1942" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Eyebrows -->
  <path d="M83 100 Q88 97 93 100" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 100 Q112 97 117 100" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 120 Q100 128 109 120" stroke="#c0703a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Stethoscope -->
  <path d="M78 162 Q68 178 73 188 Q78 198 88 193" stroke="#9d174d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="193" r="5" fill="#9d174d"/>
  <!-- Coat lapels -->
  <polygon points="50,145 85,145 68,185 50,185" fill="white" opacity="0.95"/>
  <polygon points="150,145 115,145 132,185 150,185" fill="white" opacity="0.95"/>
  <!-- Badge -->
  <rect x="88" y="170" width="24" height="14" rx="3" fill="#fce7f3"/>
  <rect x="91" y="173" width="18" height="2" rx="1" fill="#EC4899"/>
  <rect x="91" y="177" width="12" height="2" rx="1" fill="#f9a8d4"/>
</svg>
