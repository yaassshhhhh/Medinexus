<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Background -->
  <rect width="200" height="240" rx="16" fill="#EEF2FF"/>
  <!-- Body / coat -->
  <rect x="50" y="145" width="100" height="95" rx="12" fill="#4F6EF7"/>
  <!-- Shirt collar -->
  <polygon points="85,145 100,165 115,145" fill="white"/>
  <!-- Stethoscope -->
  <path d="M75 160 Q65 175 70 185 Q75 195 85 190" stroke="#1e3a8a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="85" cy="190" r="5" fill="#1e3a8a"/>
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="25" rx="8" fill="#FBBF8A"/>
  <!-- Head -->
  <ellipse cx="100" cy="108" rx="34" ry="36" fill="#FBBF8A"/>
  <!-- Hair -->
  <ellipse cx="100" cy="78" rx="34" ry="18" fill="#1a1a2e"/>
  <rect x="66" y="78" width="68" height="16" fill="#1a1a2e"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="108" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="112" cy="108" rx="4" ry="4.5" fill="white"/>
  <circle cx="89" cy="109" r="2.5" fill="#1a1a2e"/>
  <circle cx="113" cy="109" r="2.5" fill="#1a1a2e"/>
  <!-- Eyebrows -->
  <path d="M83 101 Q88 98 93 101" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 101 Q112 98 117 101" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 120 Q100 127 109 120" stroke="#c0703a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Coat lapels -->
  <polygon points="50,145 85,145 70,185 50,185" fill="white" opacity="0.9"/>
  <polygon points="150,145 115,145 130,185 150,185" fill="white" opacity="0.9"/>
  <!-- Name badge -->
  <rect x="88" y="168" width="24" height="14" rx="3" fill="white"/>
  <rect x="91" y="171" width="18" height="2" rx="1" fill="#4F6EF7"/>
  <rect x="91" y="175" width="12" height="2" rx="1" fill="#93c5fd"/>
</svg>
