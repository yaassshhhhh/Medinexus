<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <rect width="200" height="240" rx="16" fill="#F0F9FF"/>
  <!-- Body -->
  <rect x="50" y="145" width="100" height="95" rx="12" fill="#0EA5E9"/>
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="25" rx="8" fill="#FBBF8A"/>
  <!-- Head -->
  <ellipse cx="100" cy="108" rx="34" ry="36" fill="#FBBF8A"/>
  <!-- Side-parted hair -->
  <ellipse cx="100" cy="76" rx="34" ry="16" fill="#374151"/>
  <rect x="66" y="76" width="68" height="16" fill="#374151"/>
  <!-- Part line -->
  <path d="M82 72 Q90 76 82 88" stroke="#4b5563" stroke-width="3" fill="none"/>
  <!-- Glasses -->
  <rect x="80" y="103" width="16" height="12" rx="4" stroke="#374151" stroke-width="2" fill="white" fill-opacity="0.3"/>
  <rect x="104" y="103" width="16" height="12" rx="4" stroke="#374151" stroke-width="2" fill="white" fill-opacity="0.3"/>
  <line x1="96" y1="109" x2="104" y2="109" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="109" x2="74" y2="111" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="109" x2="126" y2="111" stroke="#374151" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <circle cx="88" cy="109" r="2" fill="#1a1a2e"/>
  <circle cx="112" cy="109" r="2" fill="#1a1a2e"/>
  <!-- Eyebrows -->
  <path d="M83 101 Q88 98 93 101" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 101 Q112 98 117 101" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 122 Q100 129 109 122" stroke="#c0703a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Coat lapels -->
  <polygon points="50,145 85,145 68,185 50,185" fill="white" opacity="0.9"/>
  <polygon points="150,145 115,145 132,185 150,185" fill="white" opacity="0.9"/>
  <!-- Stethoscope -->
  <path d="M76 162 Q66 177 71 187 Q76 197 86 192" stroke="#0c4a6e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="192" r="5" fill="#0c4a6e"/>
  <!-- Badge -->
  <rect x="88" y="168" width="24" height="14" rx="3" fill="#e0f2fe"/>
  <rect x="91" y="171" width="18" height="2" rx="1" fill="#0EA5E9"/>
  <rect x="91" y="175" width="12" height="2" rx="1" fill="#7dd3fc"/>
</svg>
