<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="50%" style="stop-color:#0d1b2e"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="100" r="200" fill="rgba(0,212,255,0.04)"/>
  <circle cx="950" cy="100" r="140" fill="rgba(0,212,255,0.05)"/>
  <circle cx="200" cy="530" r="160" fill="rgba(14,165,233,0.04)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Left content area -->
  <!-- Logo / Brand mark -->
  <rect x="80" y="80" width="52" height="52" rx="14" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
  <!-- Cross / Medical icon -->
  <rect x="102" y="92" width="8" height="28" rx="3" fill="#00d4ff"/>
  <rect x="94" y="100" width="24" height="8" rx="3" fill="#00d4ff"/>

  <!-- Brand name -->
  <text x="148" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">Medinexus</text>
  <text x="148" y="136" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#00d4ff">AI Healthcare Platform</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="white">Healthcare</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#00d4ff">Made Easy</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="22" fill="#8ba3c7">Book appointments with verified doctors.</text>
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="22" fill="#8ba3c7">AI-powered health guidance. Anytime, anywhere.</text>

  <!-- Stats row -->
  <rect x="80" y="450" width="160" height="70" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="160" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">150+</text>
  <text x="160" y="505" font-family="Arial, sans-serif" font-size="13" fill="#8ba3c7" text-anchor="middle">Verified Doctors</text>

  <rect x="260" y="450" width="160" height="70" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="340" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">6+</text>
  <text x="340" y="505" font-family="Arial, sans-serif" font-size="13" fill="#8ba3c7" text-anchor="middle">Specialities</text>

  <rect x="440" y="450" width="160" height="70" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="520" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">24/7</text>
  <text x="520" y="505" font-family="Arial, sans-serif" font-size="13" fill="#8ba3c7" text-anchor="middle">AI Support</text>

  <!-- Right side — Doctor card mockup -->
  <rect x="720" y="140" width="400" height="350" rx="24" fill="url(#cardGrad)" stroke="rgba(0,212,255,0.25)" stroke-width="1.5"/>

  <!-- Doctor avatar circle -->
  <circle cx="820" cy="240" r="60" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="2"/>
  <!-- Doctor silhouette -->
  <circle cx="820" cy="220" r="22" fill="#00d4ff" opacity="0.7"/>
  <path d="M780 290 Q820 265 860 290 L860 300 Q820 280 780 300 Z" fill="#00d4ff" opacity="0.7"/>

  <!-- Doctor info -->
  <text x="900" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Dr. Rahul Sharma</text>
  <text x="900" y="248" font-family="Arial, sans-serif" font-size="15" fill="#00d4ff">General Physician</text>
  <!-- Stars -->
  <text x="900" y="275" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">★★★★★</text>
  <text x="1000" y="275" font-family="Arial, sans-serif" font-size="14" fill="#8ba3c7">4.8 (120)</text>

  <!-- Available badge -->
  <rect x="900" y="288" width="130" height="26" rx="13" fill="rgba(74,222,128,0.12)" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
  <circle cx="916" cy="301" r="5" fill="#4ade80"/>
  <text x="928" y="306" font-family="Arial, sans-serif" font-size="13" fill="#4ade80">Available Today</text>

  <!-- Book button -->
  <rect x="760" y="400" width="320" height="50" rx="14" fill="url(#bg)" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
  <rect x="760" y="400" width="320" height="50" rx="14" fill="rgba(14,165,233,0.2)"/>
  <text x="920" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="white" text-anchor="middle">📅 Book Appointment</text>

  <!-- Second doctor card (partial, behind) -->
  <rect x="760" y="460" width="360" height="80" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="800" cy="500" r="22" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <circle cx="800" cy="494" r="9" fill="#00d4ff" opacity="0.5"/>
  <path d="M782 516 Q800 506 818 516" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="836" y="492" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="white">Dr. Priya Kapoor</text>
  <text x="836" y="512" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff">Gynecologist</text>
  <text x="836" y="530" font-family="Arial, sans-serif" font-size="13" fill="#f59e0b">★★★★★ </text>
  <text x="896" y="530" font-family="Arial, sans-serif" font-size="12" fill="#8ba3c7">4.9</text>

  <!-- Bottom URL -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="16" fill="rgba(139,163,199,0.6)" text-anchor="middle">medinexus.vercel.app</text>
</svg>
