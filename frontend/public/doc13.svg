<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <rect width="200" height="240" rx="16" fill="#F0FFF4"/>
  <!-- Body -->
  <rect x="50" y="145" width="100" height="95" rx="12" fill="#16A34A"/>
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="25" rx="8" fill="#F5C5A3"/>
  <!-- Head -->
  <ellipse cx="100" cy="108" rx="34" ry="36" fill="#F5C5A3"/>
  <!-- Straight long hair -->
  <ellipse cx="100" cy="76" rx="34" ry="16" fill="#0f172a"/>
  <rect x="66" y="76" width="68" height="18" fill="#0f172a"/>
  <rect x="66" y="82" width="10" height="55" rx="5" fill="#0f172a"/>
  <rect x="124" y="82" width="10" height="55" rx="5" fill="#0f172a"/>
  <!-- Ears -->
  <ellipse cx="66" cy="110" rx="6" ry="8" fill="#F5C5A3"/>
  <ellipse cx="134" cy="110" rx="6" ry="8" fill="#F5C5A3"/>
  <!-- Small stud earrings -->
  <circle cx="66" cy="112" r="2.5" fill="#16A34A"/>
  <circle cx="134" cy="112" r="2.5" fill="#16A34A"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="108" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="112" cy="108" rx="4" ry="4.5" fill="white"/>
  <circle cx="89" cy="109" r="2.5" fill="#0f172a"/>
  <circle cx="113" cy="109" r="2.5" fill="#0f172a"/>
  <!-- Eyebrows -->
  <path d="M83 100 Q88 97 93 100" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 100 Q112 97 117 100" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 120 Q100 128 109 120" stroke="#c0703a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Coat lapels -->
  <polygon points="50,145 85,145 68,185 50,185" fill="white" opacity="0.9"/>
  <polygon points="150,145 115,145 132,185 150,185" fill="white" opacity="0.9"/>
  <!-- Stethoscope -->
  <path d="M76 162 Q66 177 71 187 Q76 197 86 192" stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="192" r="5" fill="#14532d"/>
  <!-- Badge -->
  <rect x="88" y="168" width="24" height="14" rx="3" fill="#dcfce7"/>
  <rect x="91" y="171" width="18" height="2" rx="1" fill="#16A34A"/>
  <rect x="91" y="175" width="12" height="2" rx="1" fill="#86efac"/>
</svg>
