<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <rect width="200" height="240" rx="16" fill="#F0FDFA"/>
  <!-- Body -->
  <rect x="50" y="145" width="100" height="95" rx="12" fill="#0D9488"/>
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="25" rx="8" fill="#8B5E3C"/>
  <!-- Head - dark skin -->
  <ellipse cx="100" cy="108" rx="34" ry="36" fill="#8B5E3C"/>
  <!-- Natural afro hair -->
  <ellipse cx="100" cy="80" rx="40" ry="28" fill="#1c1917"/>
  <circle cx="68" cy="90" r="14" fill="#1c1917"/>
  <circle cx="132" cy="90" r="14" fill="#1c1917"/>
  <circle cx="80" cy="76" r="12" fill="#1c1917"/>
  <circle cx="120" cy="76" r="12" fill="#1c1917"/>
  <!-- Ears -->
  <ellipse cx="66" cy="110" rx="6" ry="8" fill="#8B5E3C"/>
  <ellipse cx="134" cy="110" rx="6" ry="8" fill="#8B5E3C"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="108" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="112" cy="108" rx="4" ry="4.5" fill="white"/>
  <circle cx="89" cy="109" r="2.5" fill="#1c1917"/>
  <circle cx="113" cy="109" r="2.5" fill="#1c1917"/>
  <!-- Eyebrows -->
  <path d="M83 101 Q88 98 93 101" stroke="#1c1917" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M107 101 Q112 98 117 101" stroke="#1c1917" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M91 120 Q100 128 109 120" stroke="#5c3317" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Coat lapels -->
  <polygon points="50,145 85,145 68,185 50,185" fill="white" opacity="0.9"/>
  <polygon points="150,145 115,145 132,185 150,185" fill="white" opacity="0.9"/>
  <!-- Stethoscope -->
  <path d="M76 162 Q66 177 71 187 Q76 197 86 192" stroke="#134e4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="86" cy="192" r="5" fill="#134e4a"/>
  <!-- Badge -->
  <rect x="88" y="168" width="24" height="14" rx="3" fill="#ccfbf1"/>
  <rect x="91" y="171" width="18" height="2" rx="1" fill="#0D9488"/>
  <rect x="91" y="175" width="12" height="2" rx="1" fill="#5eead4"/>
</svg>
